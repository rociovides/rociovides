<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes drawLine {
      from { stroke-dashoffset: 240; }
      to   { stroke-dashoffset: 0; }
    }
    .name  { font-family: Georgia, 'Times New Roman', serif; animation: fadeUp .7s ease-out forwards; opacity: 0; transform-origin: left; }
    .role  { font-family: 'Segoe UI', system-ui, sans-serif; animation: fadeUp .7s ease-out .22s forwards; opacity: 0; transform-origin: left; }
    .underline { stroke-dasharray: 240; stroke-dashoffset: 240; animation: drawLine 1s ease-out .5s forwards; }
  </style>

  <rect width="1000" height="220" fill="#432720"/>
  <circle cx="960" cy="20" r="170" fill="#65232B" opacity="0.45"/>
  <circle cx="1010" cy="160" r="90" fill="#ECAAB2" opacity="0.12"/>

  <text x="64" y="108" class="name" font-size="52" fill="#F8E5D7" letter-spacing="0.5">Rocío Vides</text>

  <text x="66" y="146" class="role" font-size="14" fill="#ECAAB2" letter-spacing="4">FULL STACK DEVELOPER</text>
  <line x1="66" y1="160" x2="306" y2="160" stroke="#ECAAB2" stroke-width="2" class="underline"/>
</svg>
