<svg width="640" height="270" viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .l1 { animation: fadeIn .4s ease-out .3s both; }
    .l2 { animation: fadeIn .4s ease-out 1.3s both; }
    .l3 { animation: fadeIn .4s ease-out 2.1s both; }
    .l4 { animation: fadeIn .4s ease-out 3.1s both; }
    .l5 { animation: fadeIn .4s ease-out 4.1s both; }
    .cursor { animation: blink 1s step-end 4.5s infinite; opacity: 0; }
  </style>

  <rect width="640" height="270" rx="12" fill="#432720"/>
  <rect width="640" height="34" rx="12" fill="#65232B"/>
  <rect y="22" width="640" height="12" fill="#65232B"/>

  <circle cx="22" cy="17" r="5.5" fill="#65232B" stroke="#F8E5D7" stroke-width="1"/>
  <circle cx="40" cy="17" r="5.5" fill="#ECAAB2"/>
  <circle cx="58" cy="17" r="5.5" fill="#F8E5D7"/>
  <text x="320" y="22" text-anchor="middle" fill="#F8E5D7" opacity="0.7" font-size="12.5">rocio@portfolio</text>

  <g fill="#F8E5D7">
    <text x="24" y="72" class="l1"><tspan fill="#ECAAB2">$</tspan> git commit -m "funciona en mi máquina"</text>
    <text x="24" y="102" class="l2"><tspan fill="#ECAAB2">$</tspan> npm run build</text>
    <text x="24" y="132" class="l3">&gt; build exitoso <tspan fill="#ECAAB2">[ok]</tspan></text>
    <text x="24" y="162" class="l4"><tspan fill="#ECAAB2">$</tspan> echo "ahora sí, funciona en todas"</text>
    <text x="24" y="192" class="l5">ahora sí, funciona en todas</text>
    <text x="24" y="222" class="l5"><tspan fill="#ECAAB2">$</tspan> <tspan class="cursor">▌</tspan></text>
  </g>
</svg>
