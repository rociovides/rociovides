<svg width="500" height="230" viewBox="0 0 500 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .l1 { animation: fadeIn .4s ease-out .3s both; }
    .l2 { animation: fadeIn .4s ease-out 1.1s both; }
    .l3 { animation: fadeIn .4s ease-out 1.9s both; }
    .l4 { animation: fadeIn .4s ease-out 2.7s both; }
    .cursor { animation: blink 1s step-end 3.2s infinite; opacity: 0; }
  </style>

  <rect width="500" height="230" rx="10" fill="#000000"/>
  <rect width="500" height="32" rx="10" fill="#000000"/>
  <rect y="20" width="500" height="12" fill="#000000"/>
  <circle cx="20" cy="16" r="5.5" fill="none" stroke="#2C5678" stroke-width="1.2"/>
  <circle cx="38" cy="16" r="5.5" fill="#9FCBE8"/>
  <circle cx="56" cy="16" r="5.5" fill="#F2F7FB"/>
  <text x="250" y="21" text-anchor="middle" fill="#F2F7FB" opacity="0.55" font-size="12.5">rocio@portfolio: ~</text>

  <g fill="#F2F7FB">
    <text x="24" y="72" class="l1"><tspan fill="#9FCBE8">$</tspan> npm install cafe</text>
    <text x="24" y="102" class="l2"><tspan fill="#9FCBE8">&gt;</tspan> error: cafe not found</text>
    <text x="24" y="132" class="l3"><tspan fill="#9FCBE8">$</tspan> brew install cafe --force</text>
    <text x="24" y="162" class="l4"><tspan fill="#9FCBE8">&gt;</tspan> instalando... listo</text>
    <text x="24" y="196" class="l4"><tspan fill="#9FCBE8">$</tspan> <tspan class="cursor">▌</tspan></text>
  </g>
</svg>
