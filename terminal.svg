<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .l1 { animation: fadeIn .4s ease-out .3s both; }
    .l2 { animation: fadeIn .4s ease-out .9s both; }
    .l3 { animation: fadeIn .4s ease-out 1.7s both; }
    .l4 { animation: fadeIn .4s ease-out 2.3s both; }
    .l5 { animation: fadeIn .4s ease-out 2.9s both; }
    .l6 { animation: fadeIn .4s ease-out 3.7s both; }
    .l7 { animation: fadeIn .4s ease-out 4.3s both; }
    .l8 { animation: fadeIn .4s ease-out 4.9s both; }
    .l9 { animation: fadeIn .4s ease-out 5.5s both; }
    .cursor { animation: blink 1s step-end 6s infinite; opacity: 0; }
  </style>

  <rect width="700" height="420" rx="10" fill="#000000"/>
  <rect width="700" height="32" rx="10" fill="#000000"/>
  <rect y="20" width="700" height="12" fill="#000000"/>
  <circle cx="20" cy="16" r="5.5" fill="none" stroke="#2C5678" stroke-width="1.2"/>
  <circle cx="38" cy="16" r="5.5" fill="#9FCBE8"/>
  <circle cx="56" cy="16" r="5.5" fill="#F2F7FB"/>
  <text x="350" y="21" text-anchor="middle" fill="#F2F7FB" opacity="0.55" font-size="12.5">rocio@portfolio: ~</text>

  <g fill="#F2F7FB">
    <text x="24" y="70" class="l1"><tspan fill="#9FCBE8">$</tspan> whoami</text>
    <text x="24" y="98" class="l2" font-weight="600">Rocío Vides — Full Stack Developer</text>

    <text x="24" y="142" class="l3"><tspan fill="#9FCBE8">$</tspan> cat intereses.txt</text>
    <text x="24" y="168" class="l4">Estudiante de Ingeniería en Informática</text>
    <text x="24" y="194" class="l5">Java · Python · Angular · Docker</text>

    <text x="24" y="238" class="l6"><tspan fill="#9FCBE8">$</tspan> npm install cafe</text>
    <text x="24" y="264" class="l7"><tspan fill="#9FCBE8">&gt;</tspan> error: cafe not found</text>
    <text x="24" y="290" class="l8"><tspan fill="#9FCBE8">$</tspan> brew install cafe --force</text>
    <text x="24" y="316" class="l9"><tspan fill="#9FCBE8">&gt;</tspan> instalando... listo</text>

    <text x="24" y="352" class="l9"><tspan fill="#9FCBE8">$</tspan> <tspan class="cursor">▌</tspan></text>
  </g>
</svg>
